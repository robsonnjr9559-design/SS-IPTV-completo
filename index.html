<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M3U Studio Pro - Seletor de Conteúdo</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #000000;
            --card-bg: #0a0a0a;
            --ferrari-red: #FF2800;
            --text-main: #ffffff;
            --success: #00C851;
            --warning: #ffbb33;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .container { 
            background: var(--card-bg); border: 2px solid var(--ferrari-red); border-radius: 12px; 
            padding: 35px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 10px 30px rgba(255, 40, 0, 0.15);
        }
        
        .logo-txt { font-size: 26px; font-weight: 900; margin-bottom: 25px; }
        .red-text { color: var(--ferrari-red); }
        
        .form-group { text-align: left; margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #888; font-weight: 700; margin-bottom: 5px; margin-left: 5px; }
        
        .inp, select.inp { 
            width: 100%; padding: 14px; background: #151515; 
            border: 1px solid #333; color: #fff; font-weight: 600; 
            border-radius: 8px; font-size: 14px; outline: none; transition: 0.3s;
        }
        .inp:focus, select.inp:focus { border-color: var(--ferrari-red); background: #1a1a1a; }
        select.inp { appearance: none; cursor: pointer; color: var(--warning); font-weight: 800; }
        
        /* Ícone no Select para indicar que é clicável */
        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: '\f0d7'; font-family: "Font Awesome 6 Free"; font-weight: 900;
            position: absolute; right: 15px; top: 15px; color: var(--warning); pointer-events: none;
        }

        .btn { 
            width: 100%; padding: 16px; margin-top: 20px; background: var(--ferrari-red); 
            color: #fff; border: none; font-weight: 900; border-radius: 8px; font-size: 16px; 
            cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn:hover { background: #d62200; transform: scale(0.98); }
        .btn:disabled { background: #333; color: #888; cursor: not-allowed; transform: none; }
        
        .status-box { margin-top: 20px; font-size: 14px; font-weight: 600; display: none; color: var(--warning); }
        .spin { animation: fa-spin 2s infinite linear; }
        
        .result-area { margin-top: 20px; display: none; background: #111; padding: 20px; border-radius: 8px; border: 1px solid var(--success); }
        .success-text { color: var(--success); font-weight: 800; margin-bottom: 10px; font-size: 18px; }
        .stats { font-size: 14px; color: #ccc; margin-bottom: 15px; font-weight: 600; }
        .stats span { color: #fff; font-weight: 900; font-size: 16px; }
        
        .btn-download {
            display: inline-block; width: 100%; padding: 14px; background: var(--success); 
            color: #fff; text-decoration: none; border-radius: 8px; font-weight: 900; font-size: 14px; transition: 0.2s;
        }
        .btn-download:hover { background: #009e40; transform: scale(0.98); }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-txt"><i class="fas fa-sliders red-text"></i> M3U <span class="red-text">STUDIO</span></div>

    <form id="extractForm" onsubmit="event.preventDefault(); startExtraction();">
        <div class="form-group">
            <input type="url" id="serverUrl" class="inp" placeholder="URL DNS (Ex: http://tv.com:8080)" required autocomplete="off">
        </div>
        <div class="form-group">
            <input type="text" id="username" class="inp" placeholder="USUÁRIO" required autocomplete="off">
        </div>
        <div class="form-group">
            <input type="text" id="password" class="inp" placeholder="SENHA" required autocomplete="off">
        </div>
        
        <div class="form-group select-wrapper">
            <label>1. O QUE VOCÊ QUER NA LISTA?</label>
            <select id="contentType" class="inp">
                <option value="live">📺 APENAS TV AO VIVO</option>
                <option value="movie">🎬 APENAS FILMES</option>
                <option value="series">🍿 APENAS SÉRIES</option>
                <option value="all">📦 TUDO JUNTO (Completa)</option>
            </select>
        </div>

        <div class="form-group select-wrapper">
            <label>2. QUAL O FORMATO?</label>
            <select id="format" class="inp">
                <option value="ts">Formato: TS</option>
                <option value="m3u8">Formato: M3U8</option>
            </select>
        </div>
        
        <button type="submit" class="btn" id="btnSubmit">
            <i class="fas fa-bolt"></i> GERAR MINHA LISTA
        </button>
    </form>

    <div id="statusBox" class="status-box">
        <i class="fas fa-circle-notch spin"></i> <span id="statusText">Processando dados...</span>
    </div>

    <div id="resultArea" class="result-area">
        <div class="success-text"><i class="fas fa-check-circle"></i> ARQUIVO PRONTO!</div>
        <div class="stats" id="statsText">
            </div>
        <a id="downloadBtn" href="#" class="btn-download" download="lista.m3u">
            <i class="fas fa-download"></i> BAIXAR AGORA
        </a>
    </div>
</div>

<script>
    async function startExtraction() {
        const btn = document.getElementById('btnSubmit');
        const statusBox = document.getElementById('statusBox');
        const statusText = document.getElementById('statusText');
        const resultArea = document.getElementById('resultArea');
        
        let server = document.getElementById('serverUrl').value.trim();
        let user = document.getElementById('username').value.trim();
        let pass = document.getElementById('password').value.trim();
        let format = document.getElementById('format').value;
        let contentType = document.getElementById('contentType').value;
        
        if(server.endsWith('/')) server = server.slice(0, -1);
        if(!server.startsWith('http')) server = 'http://' + server;

        btn.disabled = true;
        resultArea.style.display = 'none';
        statusBox.style.display = 'block';

        try {
            let rawUrl = `${server}/get.php?username=${user}&password=${pass}&type=m3u_plus&output=${format}`;
            let textData = "";

            statusText.innerText = "Conectando ao servidor...";
            
            try {
                const res = await fetch(rawUrl);
                if (!res.ok) throw new Error("CORS Block");
                textData = await res.text();
            } catch (e) {
                statusText.innerText = "Baixando lista de forma segura (Proxy)...";
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(rawUrl)}`;
                const proxyRes = await fetch(proxyUrl);
                if (!proxyRes.ok) throw new Error("Falha ao comunicar com o servidor.");
                textData = await proxyRes.text();
            }

            statusText.innerText = "Aplicando o seu filtro...";

            // O cabeçalho exato que você pediu sempre na primeira linha
            let m3uContent = '#EXTM3U size="Medium"\n';
            let itemCount = 0;

            const lines = textData.split('\n');
            let currentBlock = []; 

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                
                if (!line) continue;
                if (line.startsWith('#EXTM3U')) continue; 

                if (!line.startsWith('http')) {
                    currentBlock.push(line);
                } else {
                    let isMovie = line.includes('/movie/');
                    let isSeries = line.includes('/series/');
                    let isLive = !isMovie && !isSeries;

                    let keepItem = false;

                    // Lógica de escolha baseada no que o usuário selecionou no dropdown
                    if (contentType === 'live' && isLive) keepItem = true;
                    else if (contentType === 'movie' && isMovie) keepItem = true;
                    else if (contentType === 'series' && isSeries) keepItem = true;
                    else if (contentType === 'all') keepItem = true;

                    if (keepItem) {
                        m3uContent += currentBlock.join('\n') + '\n' + line + '\n';
                        itemCount++;
                    }
                    
                    currentBlock = []; // Reseta para o próximo
                }
            }

            // Define o nome do arquivo que será baixado de acordo com a escolha
            let fileName = "lista_completa.m3u";
            let typeLabel = "Itens";
            
            if (contentType === 'live') { fileName = "tv_ao_vivo.m3u"; typeLabel = "Canais"; }
            else if (contentType === 'movie') { fileName = "filmes.m3u"; typeLabel = "Filmes"; }
            else if (contentType === 'series') { fileName = "series.m3u"; typeLabel = "Episódios"; }

            const blob = new Blob([m3uContent], { type: 'text/plain' });
            const blobUrl = URL.createObjectURL(blob);
            
            document.getElementById('statsText').innerHTML = `Total Extraído:<br><span>${itemCount} ${typeLabel}</span>`;
            
            let downloadBtn = document.getElementById('downloadBtn');
            downloadBtn.href = blobUrl;
            downloadBtn.download = fileName;
            
            statusBox.style.display = 'none';
            resultArea.style.display = 'block';

        } catch (error) {
            statusBox.style.display = 'none';
            alert("ERRO: Falha ao baixar a lista. Verifique os dados inseridos.");
            console.error(error);
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
