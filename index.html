<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M3U Extrator Exclusivo - SÉRIES</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050505;
            --card-bg: #111111;
            --series-color: #aa66cc;
            --series-hover: #8844aa;
            --text-main: #ffffff;
            --success: #00C851;
            --warning: #ffbb33;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; outline: none; }
        body { background-color: var(--bg-deep); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .container { 
            background: var(--card-bg); border: 2px solid var(--series-color); border-radius: 12px; 
            padding: 35px; width: 100%; max-width: 500px; text-align: center; box-shadow: 0 10px 30px rgba(170, 102, 204, 0.15);
        }
        
        .logo-txt { font-size: 26px; font-weight: 900; margin-bottom: 5px; color: #fff; }
        .sub-txt { font-size: 12px; color: #888; margin-bottom: 25px; font-weight: 600; text-transform: uppercase; }
        .highlight { color: var(--series-color); }
        
        .inp, select.inp { 
            width: 100%; padding: 15px; margin: 8px 0; background: #1a1a1a; 
            border: 1px solid #333; color: #fff; font-weight: 600; 
            border-radius: 8px; font-size: 14px; transition: 0.3s; text-align: center;
        }
        .inp:focus, select.inp:focus { border-color: var(--series-color); background: #222; }
        
        .btn { 
            width: 100%; padding: 16px; margin-top: 20px; background: var(--series-color); 
            color: #fff; border: none; font-weight: 900; border-radius: 8px; font-size: 16px; 
            cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px; text-transform: uppercase;
        }
        .btn:hover { background: var(--series-hover); transform: scale(0.98); }
        .btn:disabled { background: #333; color: #888; cursor: not-allowed; transform: none; }
        
        .progress-box { margin-top: 25px; display: none; background: #1a1a1a; border-radius: 8px; padding: 20px; border: 1px solid #333; }
        .spin { animation: fa-spin 2s infinite linear; font-size: 24px; color: var(--series-color); margin-bottom: 15px; display: inline-block;}
        .status-title { font-size: 14px; font-weight: 800; color: #fff; margin-bottom: 8px; }
        .status-desc { font-size: 13px; color: var(--warning); font-weight: 600; line-height: 1.5; word-wrap: break-word;}
        
        .progress-bar-bg { width: 100%; height: 8px; background: #333; border-radius: 10px; margin-top: 15px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--series-color); width: 0%; transition: width 0.3s ease; }

        .result-area { margin-top: 20px; display: none; background: #111; padding: 20px; border-radius: 8px; border: 1px solid var(--success); }
        .success-text { color: var(--success); font-weight: 800; margin-bottom: 10px; font-size: 18px; }
        .stats { font-size: 14px; color: #ccc; margin-bottom: 15px; font-weight: 600; }
        .stats span { color: #fff; font-weight: 900; font-size: 16px; }
        
        .btn-download {
            display: inline-block; width: 100%; padding: 14px; background: var(--success); 
            color: #fff; text-decoration: none; border-radius: 8px; font-weight: 900; font-size: 14px; transition: 0.2s;
        }
        .btn-download:hover { background: #009e40; transform: scale(0.98); }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-txt"><i class="fas fa-clapperboard highlight"></i> M3U <span class="highlight">SÉRIES</span></div>
    <div class="sub-txt">Extrator de Episódios via API Profunda</div>

    <form onsubmit="event.preventDefault(); SeriesExtractor.start();">
        <input type="url" id="serverUrl" class="inp" placeholder="URL DNS (Ex: http://tv.com:8080)" required autocomplete="off">
        <input type="text" id="username" class="inp" placeholder="USUÁRIO" required autocomplete="off">
        <input type="text" id="password" class="inp" placeholder="SENHA" required autocomplete="off">
        
        <select id="format" class="inp" style="appearance: none; cursor: pointer; color: var(--warning);">
            <option value="ts">Formato: TS (Smart TV / Nativo)</option>
            <option value="m3u8">Formato: M3U8 (Web / Celular)</option>
        </select>
        
        <button type="submit" class="btn" id="btnSubmit">
            <i class="fas fa-search"></i> Extrair Minhas Séries
        </button>
    </form>

    <div id="progressBox" class="progress-box">
        <i class="fas fa-circle-notch spin"></i> 
        <div class="status-title" id="statusTitle">Conectando ao Painel...</div>
        <div class="status-desc" id="statusDesc">Aguarde a resposta do servidor.</div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
    </div>

    <div id="resultArea" class="result-area">
        <div class="success-text"><i class="fas fa-check-circle"></i> EXTRAÇÃO CONCLUÍDA!</div>
        <div class="stats" id="statsText"></div>
        <a id="downloadBtn" href="#" class="btn-download" download="series_completas.m3u">
            <i class="fas fa-download"></i> BAIXAR SÉRIES (.M3U)
        </a>
    </div>
</div>

<script>
    var SeriesExtractor = {
        m3u: '', totalEps: 0, server: '', user: '', pass: '', format: '',

        start: async function() {
            this.server = document.getElementById('serverUrl').value.trim();
            this.user = document.getElementById('username').value.trim();
            this.pass = document.getElementById('password').value.trim();
            this.format = document.getElementById('format').value;

            if(this.server.endsWith('/')) this.server = this.server.slice(0, -1);
            if(!this.server.startsWith('http')) this.server = 'http://' + this.server;

            document.getElementById('btnSubmit').disabled = true;
            document.getElementById('resultArea').style.display = 'none';
            document.getElementById('progressBox').style.display = 'block';
            this.updateStatus("Autenticando...", "Verificando conexão com a matriz.");
            this.updateProgress(5);

            this.m3u = '#EXTM3U size="Medium"\n';
            this.totalEps = 0;

            try {
                await this.processAllSeries();
            } catch (error) {
                this.updateStatus("ERRO FATAL", error.message);
                document.getElementById('btnSubmit').disabled = false;
                document.querySelector('.spin').style.display = 'none';
            }
        },

        updateStatus: function(title, desc) {
            document.getElementById('statusTitle').innerText = title;
            document.getElementById('statusDesc').innerText = desc;
        },

        updateProgress: function(percent) {
            document.getElementById('progressBar').style.width = percent + '%';
        },

        // Função moderna e segura para requisições com bypass automático
        fetchAPI: async function(actionStr) {
            let url = `${this.server}/player_api.php?username=${this.user}&password=${this.pass}&${actionStr}`;
            let proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
            
            try {
                // Tenta direto primeiro
                let res = await fetch(url);
                if (!res.ok) throw new Error("CORS");
                let data = await res.json();
                return data;
            } catch (e) {
                // Se o navegador barrar, usa o proxy
                let resProxy = await fetch(proxyUrl);
                if (!resProxy.ok) throw new Error("Falha na Matriz");
                let data = await resProxy.json();
                return data;
            }
        },

        processAllSeries: async function() {
            this.updateStatus("Mapeando Banco de Dados...", "Baixando categorias de séries.");
            let cats = await this.fetchAPI("action=get_series_categories");
            
            let catMap = {};
            if (cats && cats.length) {
                for(let c of cats) catMap[c.category_id] = c.category_name;
            }

            this.updateStatus("Localizando Séries...", "Baixando índice principal de séries.");
            this.updateProgress(10);
            let seriesList = await this.fetchAPI("action=get_series");

            if (!seriesList || seriesList.length === 0) {
                throw new Error("Nenhuma série encontrada neste servidor.");
            }

            let totalSeries = seriesList.length;
            
            // Vamos processar as séries 1 por 1 (para evitar que o servidor da matriz bloqueie seu IP por excesso de velocidade)
            for (let i = 0; i < totalSeries; i++) {
                let s = seriesList[i];
                let percent = Math.floor(10 + ((i / totalSeries) * 90));
                
                this.updateStatus(`Extraindo (${i+1} de ${totalSeries})`, `Processando: ${s.name || s.title || 'Desconhecido'} \nEpisódios encontrados até agora: ${this.totalEps}`);
                this.updateProgress(percent);

                try {
                    let info = await this.fetchAPI(`action=get_series_info&series_id=${s.series_id}`);
                    if (info && info.episodes) {
                        let catName = catMap[s.category_id] || "Séries";
                        let sName = s.name || s.title || "Série";
                        let cover = s.cover || "";

                        // Varre temporadas e episódios
                        for (let seasonKey in info.episodes) {
                            let eps = info.episodes[seasonKey];
                            for (let e = 0; e < eps.length; e++) {
                                let ep = eps[e];
                                let ext = ep.container_extension || "mp4";
                                let epUrl = `${this.server}/series/${this.user}/${this.pass}/${ep.id}.${ext}`;
                                
                                let sNum = parseInt(seasonKey);
                                let eNum = parseInt(ep.episode_num || (e+1));
                                let epTitle = `${sName} - S${sNum<10?'0':''}${sNum}E${eNum<10?'0':''}${eNum} - ${ep.title || 'Episódio '+eNum}`;
                                
                                this.m3u += `#EXTINF:-1 tvg-id="" tvg-name="${epTitle}" tvg-logo="${cover}" group-title="${catName}",${epTitle}\n${epUrl}\n`;
                                this.totalEps++;
                            }
                        }
                    }
                } catch(err) {
                    console.warn("Falha ao puxar episódios da série ID: " + s.series_id);
                }

                // Pequena pausa (100 milissegundos) para não derrubar a conexão da matriz
                await new Promise(resolve => setTimeout(resolve, 100));
            }

            this.finish();
        },

        finish: function() {
            if (this.totalEps === 0) {
                this.updateStatus("ERRO", "Nenhum episódio pôde ser extraído. O servidor pode estar bloqueando as requisições.");
                document.getElementById('btnSubmit').disabled = false;
                document.querySelector('.spin').style.display = 'none';
                return;
            }

            let blob = new Blob([this.m3u], { type: 'text/plain' });
            let blobUrl = URL.createObjectURL(blob);

            document.getElementById('statsText').innerHTML = `Sucesso total!<br><span>${this.totalEps} Episódios Copiados</span>`;
            
            let downloadBtn = document.getElementById('downloadBtn');
            downloadBtn.href = blobUrl;

            document.getElementById('progressBox').style.display = 'none';
            document.getElementById('resultArea').style.display = 'block';
            document.getElementById('btnSubmit').disabled = false;
        }
    };
</script>

</body>
</html>
