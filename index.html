<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M3U Studio Pro - Divisão Inteligente</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #000000;
            --card-bg: #0a0a0a;
            --ferrari-red: #FF2800;
            --text-main: #ffffff;
            --success: #00C851;
            --movie-color: #33b5e5;
            --series-color: #aa66cc;
            --warning: #ffbb33;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .container { 
            background: var(--card-bg); border: 2px solid var(--ferrari-red); border-radius: 12px; 
            padding: 35px; width: 100%; max-width: 500px; text-align: center; box-shadow: 0 10px 30px rgba(255, 40, 0, 0.15);
        }
        
        .logo-txt { font-size: 26px; font-weight: 900; margin-bottom: 25px; }
        .red-text { color: var(--ferrari-red); }
        
        .inp, select.inp { 
            width: 100%; padding: 15px; margin: 8px 0; background: #151515; 
            border: 1px solid #333; color: #fff; text-align: center; font-weight: 600; 
            border-radius: 8px; font-size: 14px; outline: none; transition: 0.3s;
        }
        .inp:focus, select.inp:focus { border-color: var(--ferrari-red); background: #1a1a1a; }
        select.inp { appearance: none; cursor: pointer; }

        .btn { 
            width: 100%; padding: 16px; margin-top: 15px; background: var(--ferrari-red); 
            color: #fff; border: none; font-weight: 900; border-radius: 8px; font-size: 16px; 
            cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn:hover { background: #d62200; transform: scale(0.98); }
        .btn:disabled { background: #333; color: #888; cursor: not-allowed; transform: none; }
        
        .status-box { margin-top: 20px; font-size: 14px; font-weight: 600; display: none; color: var(--warning); }
        .spin { animation: fa-spin 2s infinite linear; }
        
        .result-area { margin-top: 20px; display: none; background: #111; padding: 20px; border-radius: 8px; border: 1px solid #333; }
        .success-text { color: var(--success); font-weight: 800; margin-bottom: 15px; font-size: 18px; }
        
        /* Botões de Download Separados */
        .download-group { display: flex; flex-direction: column; gap: 10px; }
        .btn-dl { 
            display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; 
            color: #fff; text-decoration: none; border-radius: 8px; font-weight: 800; font-size: 14px; transition: 0.2s;
        }
        .btn-dl:hover { transform: scale(0.98); filter: brightness(1.1); }
        .dl-live { background: var(--success); }
        .dl-movie { background: var(--movie-color); }
        .dl-series { background: var(--series-color); }
        
        .count-badge { background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 20px; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-txt"><i class="fas fa-layer-group red-text"></i> M3U <span class="red-text">STUDIO</span></div>
    <p style="color: #888; font-size: 12px; margin-bottom: 20px; font-weight: 600;">GERA ARQUIVOS SEPARADOS PARA EVITAR TRAVAMENTOS</p>

    <form id="extractForm" onsubmit="event.preventDefault(); startExtraction();">
        <input type="url" id="serverUrl" class="inp" placeholder="URL DNS (Ex: http://tv.com:8080)" required autocomplete="off">
        <input type="text" id="username" class="inp" placeholder="USUÁRIO" required autocomplete="off">
        <input type="text" id="password" class="inp" placeholder="SENHA" required autocomplete="off">
        
        <select id="format" class="inp">
            <option value="ts">Formato de Saída: TS</option>
            <option value="m3u8">Formato de Saída: M3U8</option>
        </select>
        
        <button type="submit" class="btn" id="btnSubmit">
            <i class="fas fa-filter"></i> PROCESSAR E SEPARAR LISTAS
        </button>
    </form>

    <div id="statusBox" class="status-box">
        <i class="fas fa-circle-notch spin"></i> <span id="statusText">Conectando...</span>
    </div>

    <div id="resultArea" class="result-area">
        <div class="success-text"><i class="fas fa-check-circle"></i> LISTAS SEPARADAS COM SUCESSO!</div>
        
        <div class="download-group">
            <a id="dlLive" href="#" class="btn-dl dl-live" download="tv_ao_vivo.m3u" style="display: none;">
                <span><i class="fas fa-tv"></i> Baixar TV Ao Vivo</span>
                <span class="count-badge" id="countLive">0</span>
            </a>
            
            <a id="dlMovie" href="#" class="btn-dl dl-movie" download="filmes.m3u" style="display: none;">
                <span><i class="fas fa-film"></i> Baixar Filmes</span>
                <span class="count-badge" id="countMovie">0</span>
            </a>
            
            <a id="dlSeries" href="#" class="btn-dl dl-series" download="series.m3u" style="display: none;">
                <span><i class="fas fa-clapperboard"></i> Baixar Séries</span>
                <span class="count-badge" id="countSeries">0</span>
            </a>
        </div>
    </div>
</div>

<script>
    async function startExtraction() {
        const btn = document.getElementById('btnSubmit');
        const statusBox = document.getElementById('statusBox');
        const statusText = document.getElementById('statusText');
        const resultArea = document.getElementById('resultArea');
        
        let server = document.getElementById('serverUrl').value.trim();
        let user = document.getElementById('username').value.trim();
        let pass = document.getElementById('password').value.trim();
        let format = document.getElementById('format').value;
        
        if(server.endsWith('/')) server = server.slice(0, -1);
        if(!server.startsWith('http')) server = 'http://' + server;

        btn.disabled = true;
        resultArea.style.display = 'none';
        statusBox.style.display = 'block';

        // Esconde os botões antigos
        document.getElementById('dlLive').style.display = 'none';
        document.getElementById('dlMovie').style.display = 'none';
        document.getElementById('dlSeries').style.display = 'none';

        try {
            let rawUrl = `${server}/get.php?username=${user}&password=${pass}&type=m3u_plus&output=${format}`;
            let textData = "";

            statusText.innerText = "Baixando banco de dados completo... Aguarde.";
            
            try {
                const res = await fetch(rawUrl);
                if (!res.ok) throw new Error("CORS Block");
                textData = await res.text();
            } catch (e) {
                statusText.innerText = "Buscando via Proxy Seguro...";
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(rawUrl)}`;
                const proxyRes = await fetch(proxyUrl);
                if (!proxyRes.ok) throw new Error("Falha na Matriz.");
                textData = await proxyRes.text();
            }

            statusText.innerText = "Separando TV, Filmes e Séries...";

            // Inicia cada string com o cabeçalho exato que você pediu
            const header = '#EXTM3U size="Medium"\n';
            let liveM3u = header;
            let movieM3u = header;
            let seriesM3u = header;
            
            let liveCount = 0;
            let movieCount = 0;
            let seriesCount = 0;

            const lines = textData.split('\n');
            let currentBlock = []; 

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                
                if (!line) continue;
                if (line.startsWith('#EXTM3U')) continue; 

                if (!line.startsWith('http')) {
                    currentBlock.push(line);
                } else {
                    let isMovie = line.includes('/movie/');
                    let isSeries = line.includes('/series/');
                    let isLive = !isMovie && !isSeries;

                    let blockString = currentBlock.join('\n') + '\n' + line + '\n';

                    // Separa os blocos em suas respectivas variáveis
                    if (isMovie) {
                        movieM3u += blockString;
                        movieCount++;
                    } else if (isSeries) {
                        seriesM3u += blockString;
                        seriesCount++;
                    } else {
                        liveM3u += blockString;
                        liveCount++;
                    }
                    currentBlock = []; // Reseta o bloco
                }
            }

            // Criar arquivos virtuais separados
            const createBlobUrl = (content) => URL.createObjectURL(new Blob([content], { type: 'text/plain' }));

            if (liveCount > 0) {
                document.getElementById('dlLive').href = createBlobUrl(liveM3u);
                document.getElementById('countLive').innerText = liveCount;
                document.getElementById('dlLive').style.display = 'flex';
            }
            if (movieCount > 0) {
                document.getElementById('dlMovie').href = createBlobUrl(movieM3u);
                document.getElementById('countMovie').innerText = movieCount;
                document.getElementById('dlMovie').style.display = 'flex';
            }
            if (seriesCount > 0) {
                document.getElementById('dlSeries').href = createBlobUrl(seriesM3u);
                document.getElementById('countSeries').innerText = seriesCount;
                document.getElementById('dlSeries').style.display = 'flex';
            }
            
            statusBox.style.display = 'none';
            resultArea.style.display = 'block';

        } catch (error) {
            statusBox.style.display = 'none';
            alert("ERRO: Falha ao conectar. Verifique os dados ou a estabilidade da matriz.");
            console.error(error);
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
