<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M3U Studio Pro - Gerador Híbrido</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #000000;
            --card-bg: #0a0a0a;
            --ferrari-red: #FF2800;
            --text-main: #ffffff;
            --success: #00C851;
            --warning: #ffbb33;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .container { 
            background: var(--card-bg); border: 2px solid var(--ferrari-red); border-radius: 12px; 
            padding: 35px; width: 100%; max-width: 500px; text-align: center; box-shadow: 0 10px 30px rgba(255, 40, 0, 0.15);
        }
        
        .logo-txt { font-size: 26px; font-weight: 900; margin-bottom: 25px; }
        .red-text { color: var(--ferrari-red); }
        
        .inp, select.inp { 
            width: 100%; padding: 15px; margin: 8px 0; background: #151515; 
            border: 1px solid #333; color: #fff; text-align: center; font-weight: 600; 
            border-radius: 8px; font-size: 14px; outline: none; transition: 0.3s;
        }
        .inp:focus, select.inp:focus { border-color: var(--ferrari-red); background: #1a1a1a; }
        select.inp { appearance: none; cursor: pointer; }
        
        .check-group {
            display: flex; justify-content: space-between; background: #151515;
            padding: 15px; border-radius: 8px; border: 1px solid #333; margin: 10px 0;
            flex-wrap: wrap; gap: 10px;
        }
        .check-item {
            display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; cursor: pointer; color: #ccc; transition: 0.2s; flex: 1; justify-content: center;
        }
        .check-item:hover { color: #fff; }
        .check-item input { width: 18px; height: 18px; accent-color: var(--ferrari-red); cursor: pointer; }

        .btn { 
            width: 100%; padding: 16px; margin-top: 15px; background: var(--ferrari-red); 
            color: #fff; border: none; font-weight: 900; border-radius: 8px; font-size: 16px; 
            cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn:hover { background: #d62200; transform: scale(0.98); }
        .btn:disabled { background: #333; color: #888; cursor: not-allowed; transform: none; }
        
        .status-box { margin-top: 20px; font-size: 14px; font-weight: 600; display: none; color: var(--warning); }
        .spin { animation: fa-spin 2s infinite linear; }
        
        .result-area { margin-top: 20px; display: none; background: #111; padding: 20px; border-radius: 8px; border: 1px solid var(--success); }
        .success-text { color: var(--success); font-weight: 800; margin-bottom: 10px; font-size: 18px; }
        .stats { font-size: 13px; color: #aaa; margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; text-align: left; background: #000; padding: 10px; border-radius: 6px; }
        .stats span { font-weight: bold; color: #fff; float: right; }
        
        .btn-download {
            display: inline-block; width: 100%; padding: 14px; background: var(--success); 
            color: #fff; text-decoration: none; border-radius: 8px; font-weight: 900; font-size: 14px; transition: 0.2s;
        }
        .btn-download:hover { background: #009e40; transform: scale(0.98); }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-txt"><i class="fas fa-layer-group red-text"></i> M3U <span class="red-text">STUDIO</span></div>

    <form id="extractForm" onsubmit="event.preventDefault(); startExtraction();">
        <input type="url" id="serverUrl" class="inp" placeholder="URL DNS (Ex: http://tv.com:8080)" required autocomplete="off">
        <input type="text" id="username" class="inp" placeholder="USUÁRIO" required autocomplete="off">
        <input type="text" id="password" class="inp" placeholder="SENHA" required autocomplete="off">
        
        <select id="format" class="inp">
            <option value="ts">Formato de Saída: TS (Padrão / Smart TVs)</option>
            <option value="m3u8">Formato de Saída: M3U8 (Web / Celulares)</option>
        </select>

        <div class="check-group">
            <label class="check-item">
                <input type="checkbox" id="chkLive" checked> <i class="fas fa-tv"></i> TV Ao Vivo
            </label>
            <label class="check-item">
                <input type="checkbox" id="chkMovies" checked> <i class="fas fa-film"></i> Filmes
            </label>
            <label class="check-item">
                <input type="checkbox" id="chkSeries"> <i class="fas fa-clapperboard"></i> Séries
            </label>
        </div>
        
        <button type="submit" class="btn" id="btnSubmit">
            <i class="fas fa-wand-magic-sparkles"></i> CONSTRUIR LISTA M3U
        </button>
    </form>

    <div id="statusBox" class="status-box">
        <i class="fas fa-circle-notch spin"></i> <span id="statusText">Conectando...</span>
    </div>

    <div id="resultArea" class="result-area">
        <div class="success-text"><i class="fas fa-check-circle"></i> LISTA PRONTA!</div>
        <div class="stats" id="statsText">
            </div>
        <a id="downloadBtn" href="#" class="btn-download" download="lista_personalizada.m3u">
            <i class="fas fa-download"></i> BAIXAR ARQUIVO .M3U
        </a>
    </div>
</div>

<script>
    async function startExtraction() {
        const btn = document.getElementById('btnSubmit');
        const statusBox = document.getElementById('statusBox');
        const statusText = document.getElementById('statusText');
        const resultArea = document.getElementById('resultArea');
        
        let server = document.getElementById('serverUrl').value.trim();
        let user = document.getElementById('username').value.trim();
        let pass = document.getElementById('password').value.trim();
        let format = document.getElementById('format').value;
        
        let chkLive = document.getElementById('chkLive').checked;
        let chkMovies = document.getElementById('chkMovies').checked;
        let chkSeries = document.getElementById('chkSeries').checked;

        if(!chkLive && !chkMovies && !chkSeries) {
            alert("Selecione pelo menos um tipo de conteúdo (Ao Vivo, Filmes ou Séries).");
            return;
        }

        if(server.endsWith('/')) server = server.slice(0, -1);
        if(!server.startsWith('http')) server = 'http://' + server;

        btn.disabled = true;
        resultArea.style.display = 'none';
        statusBox.style.display = 'block';

        try {
            // Requisita a lista base completa (get.php) para depois filtrar localmente
            let rawUrl = `${server}/get.php?username=${user}&password=${pass}&type=m3u_plus&output=${format}`;
            let textData = "";

            statusText.innerText = "Baixando base de dados da matriz... (Isso pode levar alguns segundos)";
            
            try {
                // Tenta conexão direta primeiro
                const res = await fetch(rawUrl);
                if (!res.ok) throw new Error("CORS Block");
                textData = await res.text();
            } catch (e) {
                // Se o navegador bloquear por segurança (CORS), utiliza um proxy gratuito
                statusText.innerText = "Buscando via Proxy para contornar bloqueios...";
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(rawUrl)}`;
                const proxyRes = await fetch(proxyUrl);
                if (!proxyRes.ok) throw new Error("Matriz indisponível ou dados incorretos.");
                textData = await proxyRes.text();
            }

            statusText.innerText = "Limpando e processando categorias...";

            // Inicia o arquivo M3U com o cabeçalho específico solicitado
            let m3uContent = '#EXTM3U size="Medium"\n';
            
            let liveCount = 0;
            let movieCount = 0;
            let seriesCount = 0;

            const lines = textData.split('\n');
            let currentBlock = []; 

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                
                if (!line) continue;
                if (line.startsWith('#EXTM3U')) continue; 

                if (!line.startsWith('http')) {
                    currentBlock.push(line);
                } else {
                    // Identifica o tipo do link analisando a URL gerada pelo painel Xtream
                    let isMovie = line.includes('/movie/');
                    let isSeries = line.includes('/series/');
                    let isLive = !isMovie && !isSeries;

                    // Adiciona à lista final apenas o que o usuário escolheu
                    if ((isLive && chkLive) || (isMovie && chkMovies) || (isSeries && chkSeries)) {
                        m3uContent += currentBlock.join('\n') + '\n' + line + '\n';
                        
                        if (isLive) liveCount++;
                        if (isMovie) movieCount++;
                        if (isSeries) seriesCount++;
                    }
                    currentBlock = []; // Reseta para o próximo item
                }
            }

            const blob = new Blob([m3uContent], { type: 'text/plain' });
            const blobUrl = URL.createObjectURL(blob);
            
            // Exibe as métricas reais do que foi extraído
            document.getElementById('statsText').innerHTML = `
                ${chkLive ? `<div><i class="fas fa-tv"></i> TV Ao Vivo: <span>${liveCount}</span></div>` : ''}
                ${chkMovies ? `<div><i class="fas fa-film"></i> Filmes: <span>${movieCount}</span></div>` : ''}
                ${chkSeries ? `<div><i class="fas fa-clapperboard"></i> Episódios de Séries: <span>${seriesCount}</span></div>` : ''}
            `;
            
            document.getElementById('downloadBtn').href = blobUrl;
            
            statusBox.style.display = 'none';
            resultArea.style.display = 'block';

        } catch (error) {
            statusBox.style.display = 'none';
            alert("ERRO: Falha ao conectar. Verifique se o DNS, Usuário e Senha estão corretos.");
            console.error(error);
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
